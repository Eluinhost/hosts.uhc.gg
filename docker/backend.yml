services:
  app:
    restart: unless-stopped
    build: ..
    expose:
      - 10000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:9.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hosts
    volumes:
      - ../database/postgres:/var/lib/postgresql/data
    expose:
      - 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
