services:
  app:
    build: .
    ports:
      - "10000:10000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:9.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hosts
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "10001:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  backend:
