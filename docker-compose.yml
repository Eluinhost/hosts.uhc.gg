services:
  app:
    restart: unless-stopped
    build: .
    expose:
      - 10000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:9.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hosts
    volumes:
      - ./database/postgres:/var/lib/postgresql/data
    networks:
      - backend
    expose:
      - 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "exec caddy run --config /etc/caddy/$${CADDYFILE:-Caddyfile.dev} --adapter caddyfile"]
    command: []
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    env_file:
      - path: ./caddy/.env
        required: false

networks:
  backend:

volumes:
  caddy_data:
  caddy_config:
