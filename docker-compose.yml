# This runs a dev-local environment by building the frontend + backend,
# and serving them locally behind Caddy on localhost:80 (no hot-reloading)
#
# If you require a frontend dev-server with hot-reloading, copy the relevant
# section from docker-compose.override.examples.yml -> docker-compose.override.yml
services:
  app:
    restart: unless-stopped
    build: .
    expose:
      - 10000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:9.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hosts
    volumes:
      - ./database:/var/lib/postgresql/data
    expose:
      - 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    build:
      context: .
      dockerfile: ./caddy/Dockerfile
      target: local
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    command: []
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
