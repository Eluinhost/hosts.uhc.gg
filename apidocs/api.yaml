openapi: '3.0.0'
info:
  title: API Documentation
  description: API Documentation
  version: 0.0.0

servers:
  - url: 'https://hosts.uhc.gg/api'
    description: 'Live server'
  - url: 'http://localhost/api'
    description: 'Development server'

components:
  securitySchemes:
    UserApiToken:
      type: http
      description: "User-specific tokens that can be generated and regenerated via the website"
      scheme: basic
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-uhcgg_session
      description: "Issued by `GET /authenticate/callback` on login, `Secure; HttpOnly; SameSite=Lax; Path=/` Idle 8 days, absolute 90 days, rekeyed at most once a day. Mutating requests (POST, PATCH, PUT, DELETE) to `/api` must also send `X-CSRF: 1`;"
  responses:
    BadRequest:
      description: Bad/malformed data supplied or data did not pass validation. Response body should contain a reason why the request was rejected
    UnauthorizedError:
      description: Credentials missing or invalid - no valid session cookie and no valid api token
    ForbiddenError:
      description: You don't have permission to use this endpoint
  schemas:
    SyncResponse:
      type: string
      example: '2017-08-10T09:11:22.031Z'
    SetRulesRequest:
      type: string
      example: Some *markdown* rules
    RulesResponse:
      type: object
      properties:
        id:
          type: integer
          description: 'The revision # of the rules'
        author:
          type: string
          description: The name of the user that created this revision
        modified:
          type: string
          description: The date that this revision was created
        content:
          type: string
          description: Markdown version of the rules
      example:
        id: 10
        author: test
        modified: '2017-08-07T10:22:11.145415Z'
        content: '#RULES HERE'
    MatchResponse:
      type: object
      required:
        - id
        - author
        - opens
        - ip
        - scenarios
        - tags
        - teams
        - count
        - content
        - region
        - removed
        - created
        - roles
        - location
        - version
        - slots
        - length
        - mapSize
        - pvpEnabledAt
        - tournament
      properties:
        id:
          type: integer
          description: The unique ID of this match
        author:
          type: string
          description: The username of the creator/host
        opens:
          type: string
          description: The time that this match opens
        address:
          type: string
          description: Domain name to join (optional)
        ip:
          type: string
          description: IP + (optional) port combo for direct connect to the server
        scenarios:
          type: array
          description: A list of scenarios that will be hosted
          items:
            type: string
        tags:
          type: array
          description: A list of 'tags'
          items:
            type: string
        teams:
          type: string
          description: The team style ID
          enum:
            - ffa
            - chosen
            - random
            - captains
            - picked
            - market
            - mystery
            - rvb
            - custom
        size:
          type: number
          description: The team size (optional), not all teams require a size, this field
            will be null for those
        customStyle:
          type: string
          description: Will only be defined if `teams` === 'custom'
        count:
          type: number
          description: The match count of the host
        content:
          type: string
          description: Markdown content of the match post
        region:
          type: string
          enum:
            - NA
            - SA
            - AS
            - EU
            - AF
            - OC
        removed:
          type: boolean
          description: Whether a hosting advisor has removed this match or not
        removedBy:
          type: string
          description: Only defined if `removed` is true. The username of the account that
            did the removal
        removedReason:
          type: string
          description: Only defined if `removed` is true. The reason that `removedBy` removed
            the match
        created:
          type: string
          description: The date that the match was posted
        roles:
          type: array
          description: A list of roles that the host has
          items:
            type: string
        location:
          type: string
          description: The free-text location of the server
        version:
          type: string
          description: The version/range of versions of Minecraft the server accepts, used for overhost conflict detection
        slots:
          type: number
          description: How many slots are available on the server
        length:
          type: number
          description: How long the match is in minutes
        mapSize:
          type: number
          description: How big is the map (diameter)
        pvpEnabledAt:
          type: boolean
          description: How long into the match will PVP be enabled (in minutes)
        approvedBy:
          type: string
          description: If defined, the username that approved the match
        hostingName:
          type: string
          description: If defined, should override the users Reddit username for the match
        tournament:
          type: boolean
          description: Whether the game is a tournament or not, tournaments bypass overhosting rules
      example:
        id: 3
        author: ghowden
        opens: '2017-08-28T15:15:00Z'
        address: example.com
        ip: '255.0.0.255:5000'
        scenarios:
          - Vanilla+
        tags:
          - TEST
        teams: chosen
        size: 3
        customStyle: null
        count: 10
        content: test content
        region: NA
        removed: true
        removedBy: ghowden
        removedReason: test removal
        created: '2017-08-09T13:29:43.966Z'
        roles:
          - hosting advisor
          - trial host
        location: test
        version: "1.8 - 1.9"
        slots: 80
        length: 90
        mapSize: 1500
        pvpEnabledAt: 20
        approvedBy: everyone
        hostingName: Name Override
        tournament: false
    CreateMatchRequest:
      type: object
      required:
        - opens
        - ip
        - scenarios
        - tags
        - teams
        - count
        - content
        - region
        - location
        - version
        - slots
        - length
        - mapSize
        - pvpEnabledAt
        - tournament
      properties:
        opens:
          type: string
          description: The time that this match will open
        address:
          type: string
          description: Domain name to join (optional)
        ip:
          type: string
          description: IP + (optional) port combo for direct connect to the server
        scenarios:
          type: array
          description: A list of scenarios that will be hosted
          items:
            type: string
        tags:
          type: array
          description: A list of 'tags'
          items:
            type: string
        teams:
          type: string
          description: The team style ID
          enum:
            - ffa
            - chosen
            - random
            - captains
            - picked
            - market
            - mystery
            - rvb
            - custom
        size:
          type: number
          description: The team size (optional), not all teams require a size, this field will be null for those
        customStyle:
          type: string
          description: Will only need to be defined if `teams` === 'custom'
        count:
          type: number
          description: The match count of the host
        content:
          type: string
          description: Markdown content of the match post
        region:
          type: string
          enum:
            - NA
            - SA
            - AS
            - EU
            - AF
            - OC
        location:
          type: string
          description: The free-text location of the server
        version:
          type: string
          description: The version/range of versions of Minecraft the server accepts, used for overhost conflict detection
        slots:
          type: number
          description: How many slots are available on the server
        length:
          type: number
          description: How long the match is in minutes
        mapSize:
          type: number
          description: How big is the map (diameter)
        pvpEnabledAt:
          type: boolean
          description: How long into the match will PVP be enabled (in minutes)
        hostingName:
          type: string
          description: If defined, should override the users Reddit username for the match
        tournament:
          type: boolean
          description: Whether the game is a tournament or not, tournaments bypass overhosting rules
      example:
        opens: '2017-08-28T15:15:00Z'
        address: example.com
        ip: '255.0.0.255:5000'
        scenarios:
          - Vanilla+
        tags:
          - TEST
        teams: chosen
        size: 3
        customStyle: null
        count: 10
        content: test content
        region: NA
        location: test
        version: "1.8 - 1.9"
        slots: 80
        length: 90
        mapSize: 1500
        pvpEnabledAt: 20
        hostingName: Name Override
        tournament: false
    ModifierResponse:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: integer
          description: Unique ID for this modifier
        displayName:
          type: string
          description: The name that should be shown for this modifier
      example:
        id: 100
        displayName: CutClean
    HostApplicationResponse:
      type: object
      required:
        - id
        - username
        - created
        - status
      properties:
        id:
          type: integer
          description: The unique ID of this application
        username:
          type: string
          description: The username of the applicant
        created:
          type: string
          description: The date + time the application was submitted
        status:
          type: string
          enum:
            - pending
            - approved
            - declined
          description: The current status of the application
        reviewedBy:
          type: string
          description: Username of whoever reviewed this application, only present once reviewed
        reviewedAt:
          type: string
          description: The date + time the application was reviewed, only present once reviewed
        reviewReason:
          type: string
          description: The reason given by the reviewer, only ever present when `status` is `declined`
      example:
        id: 1
        username: test
        created: '2017-08-10T09:11:22.031Z'
        status: declined
        reviewedBy: ghowden
        reviewedAt: '2017-08-11T09:11:22.031Z'
        reviewReason: Did not answer the rules question correctly
    HostApplicationAnswerResponse:
      type: object
      required:
        - prompt
        - questionType
        - answer
      properties:
        prompt:
          type: string
          description: The prompt of the question at the time it was answered
        questionType:
          type: string
          enum:
            - multiple choice
            - text
        answer:
          type: string
          description: The answer given, the text of the picked choice for `multiple choice` questions, the free-text
            answer for `text` questions
        choiceCorrect:
          type: boolean
          nullable: true
          description: Whether the picked choice was correct, only defined for `multiple choice` questions and only
            when requested with a `hosting advisor` permission, otherwise null
      example:
        prompt: What is the maximum allowed border size?
        questionType: multiple choice
        answer: '1500'
        choiceCorrect: true
    HostApplicationDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/HostApplicationResponse'
        - type: object
          required:
            - answers
          properties:
            answers:
              type: array
              items:
                $ref: '#/components/schemas/HostApplicationAnswerResponse'
    CreateHostApplicationRequest:
      type: object
      required:
        - answers
      properties:
        answers:
          type: array
          description: One entry per quiz question, every question must be answered, answers for unknown question
            IDs are ignored
          items:
            type: object
            required:
              - questionId
              - answer
            properties:
              questionId:
                type: integer
                description: The ID of the quiz question being answered
              answer:
                type: string
                description: The answer to the question, the free-text answer for `text` questions (must not be
                  blank), the exact text of the picked choice for `multiple choice` questions
      example:
        answers:
          - questionId: 1
            answer: '1500'
          - questionId: 2
            answer: My answer to the question
    ReviewHostApplicationRequest:
      type: object
      properties:
        reason:
          type: string
          description: The reason for the decision, required (and must be non-blank) when declining an application, ignored when approving
      example:
        reason: Did not answer the rules question correctly
    QuizQuestionChoiceResponse:
      type: object
      required:
        - id
        - text
      properties:
        id:
          type: integer
          description: The unique ID of this choice
        text:
          type: string
          description: The text shown for this choice
        correct:
          type: boolean
          nullable: true
          description: Whether this is the correct choice, only defined when authenticated as a user with the `hosting advisor` permission, otherwise null
    QuizQuestionResponse:
      type: object
      required:
        - id
        - prompt
        - questionType
        - choices
      properties:
        id:
          type: integer
          description: The unique ID of this question
        prompt:
          type: string
          description: The question being asked
        questionType:
          type: string
          enum:
            - multiple choice
            - text
        choices:
          type: array
          description: The available choices, empty for `text` questions
          items:
            $ref: '#/components/schemas/QuizQuestionChoiceResponse'
        metadata:
          type: object
          nullable: true
          description: Only defined when authenticated as a user with the `hosting advisor` permission, otherwise null
          properties:
            createdBy:
              type: string
              description: Username of whoever created this question
            created:
              type: string
              description: The date + time the question was created
      example:
        id: 1
        prompt: What is the maximum allowed border size?
        questionType: multiple choice
        choices:
          - id: 1
            text: '1000'
            correct: false
          - id: 2
            text: '1500'
            correct: true
        metadata:
          createdBy: ghowden
          created: '2017-08-07T10:22:11.145415Z'
    CreateQuizQuestionRequest:
      type: object
      required:
        - prompt
        - questionType
        - choices
      properties:
        prompt:
          type: string
          description: The question being asked, must be at least 5 characters after trimming
          minLength: 5
        questionType:
          type: string
          enum:
            - multiple choice
            - text
        choices:
          type: array
          description: Required for `multiple choice` questions (at least 2, exactly 1 correct), must be an empty
            array for `text` questions
          items:
            type: object
            required:
              - text
              - correct
            properties:
              text:
                type: string
              correct:
                type: boolean
      example:
        prompt: What is the maximum allowed border size?
        questionType: multiple choice
        choices:
          - text: '1000'
            correct: false
          - text: '1500'
            correct: true

paths:
  /authenticate:
    get:
      tags:
        - Authentication
      servers:
        - url: 'https://hosts.uhc.gg'
          description: 'Live server'
        - url: 'http://localhost'
          description: 'Local server (Caddy)'
      summary: Begin the OAuth flow
      description: |
        Redirects the user to Reddit to authorise the application. The `state` parameter is an token
        generated by the frontend, round-tripped through Reddit, and echoed back by the callback so the
        frontend can validate it against the copy it kept.
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
          description: value generated by the frontend, echoed back unchanged by the callback
      responses:
        '307':
          description: Redirects to Reddit
  /authenticate/callback:
    get:
      tags:
        - Authentication
      servers:
        - url: 'https://hosts.uhc.gg'
          description: 'Live server'
        - url: 'http://localhost'
          description: 'Local server (Caddy)'
      summary: OAuth callback
      description: |
        The endpoint oauth redirects to. Exchanges the OAuth code for the user's account, creates a session, sets
        the `__Host-uhcgg_session` cookie, and redirects to `/login?state=<state>` with the `state` value the
        frontend supplied.
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: OAuth code
        - in: query
          name: state
          required: true
          schema:
            type: string
          description: value carried through from `/authenticate`
      responses:
        '307':
          description: Sets `__Host-uhcgg_session` and redirects to `/login?state=<state>`, the value the frontend supplied
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /authenticate/logout:
    post:
      tags:
        - Authentication
      servers:
        - url: 'https://hosts.uhc.gg'
          description: 'Live server'
        - url: 'http://localhost'
          description: 'Local server (Caddy)'
      security:
        - SessionCookie: []
      summary: Log out and revoke the session
      description: |
        Deletes the session row and expires the cookie.
      responses:
        '204':
          description: Logged out
  /me:
    get:
      tags:
        - Authentication
      security:
        - SessionCookie: []
      summary: Who am I?
      description: |
        Every call slides the idle window. Once per `session.rotateInterval` the session is rekeyed and
        the response carries a `Set-Cookie` with the new id.
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                required:
                  - username
                  - permissions
                properties:
                  username:
                    type: string
                  permissions:
                    type: array
                    items:
                      type: string
              example:
                username: test
                permissions:
                  - admin
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /sync:
    get:
      tags:
        - Time
      summary: Returns the server time (UTC)
      description: Used by calendar to show correct UTC times independent of the users PC
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
  /rules:
    get:
      tags:
        - Rules
      summary: Returns the hosting rules
      description: Shows the latest revision of the hosting rules, older versions are
        stored by the server but are unfetchable currently
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesResponse'
    post:
      tags:
        - Rules
      security:
        - UserApiToken: []
        - SessionCookie: []
      summary: Update the hosting rules
      description: Overwrites the hosting rules with new content, requires authentication
        with `hosting advisor` permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRulesRequest'
      responses:
        '201':
          description: Rules updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /matches/upcoming:
    get:
      tags:
        - Matches
      summary: Returns a list of upcoming matches
      description: Show matches that open after 30 minutes ago. Does not filter out removed
        matches
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchResponse'
  /matches:
    post:
      tags:
        - Matches
      security:
        - UserApiToken: []
        - SessionCookie: []
      summary: Posts a new match
      description: Attempts to post a new match. Requires either `trial host` or `host` permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatchRequest'
      responses:
        '201':
          description: Created, returns the stored data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  '/matches/{id}':
    get:
      tags:
        - Matches
      summary: Get a specific match
      description: Fetches data from a specific match, even if it opened a long time ago
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the match to get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '404':
          description: Could not find a match with the given ID
    delete:
      tags:
        - Matches
      security:
        - UserApiToken: []
        - SessionCookie: []
      summary: Remove a match
      description: Removes a match, requires the `hosting advisor` permission or that the caller created the match, cannot be reversed
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the match to remove
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  description: A short description on why you want to remove this match
                  minLength: 3
                  maxLength: 255
              example:
                reason: Server exploded, can't host
      responses:
        '204':
          description: Match removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Could not find a match with the given ID
  '/matches/{id}/approve':
    post:
      tags:
        - Matches
      security:
        - UserApiToken: []
        - SessionCookie: []
      summary: Approve a match
      description: Approves a match, requires `hosting advisor` permission
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the match to get
      responses:
        '200':
          description: Success
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Could not find a match with the given ID
  '/matches/conflicts':
    get:
      tags:
        - Matches
      summary: Check for potential conflicts
      description: Shows matches +-15 minutes of the given time and region
      parameters:
        - in: query
          name: region
          required: true
          description: The region to check in
          schema:
            type: string
            enum:
              - NA
              - SA
              - AS
              - EU
              - AF
              - OC
          example: OC
        - in: query
          name: version
          required: true
          description: The server version/range used for overhost conflict detection
          schema:
            type: string
          example: 1.8
        - in: query
          name: opens
          required: true
          description: The time to check around
          schema:
            type: string
          example: '2017-08-07T10:22:11.145415Z'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchResponse'
  /hosts/{host}/matches:
    get:
      tags:
        - Matches
      summary: List hosted matches
      description: Lists hosted matches for the given host in reverse created order.
      parameters:
        - in: path
          name: host
          schema:
            type: string
          required: true
          description: The username of the host
        - in: query
          name: count
          schema:
            type: integer
          required: false
          default: 20
          description: How many entries to return max
          max: 50
          min: 1
        - in: query
          name: before
          schema:
            type: integer
          required: false
          description: Show matches IDs less than this ID used for pagination of data
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /permissions:
    get:
      tags:
        - Permissions
      summary: List count for each permission ID
      description: Shows all permissions and how many users have that permission
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: a map of permission name to number of members with that permission
                additionalProperties:
                  type: number
                  description: Number of users with this permission
                example:
                  admin: 5
                  host: 117
                  hosting advisor: 13
                  hosting banned: 3
                  trial host: 808
  /permissions/log:
    get:
      tags:
        - Permissions
      summary: Lists log of permissions changes
      description: Lists a recent history of permissions changes. Authentication is optional; unless the
        authenticated user has the `admin` or `hosting advisor` permission, `modifier` will be `moderation team`
      security:
        - SessionCookie: []
      parameters:
        - in: query
          name: before
          schema:
            type: integer
          description: If defined only shows items before the given ID
        - in: query
          name: count
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: How many to return
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                example:
                  - id: 10
                    modifier: ghowden
                    username: LeonTG77
                    at: '2017-08-07T10:22:11.145415Z'
                    permission: host
                    added: false
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      required: true
                      description: The unique ID of this log
                    modifier:
                      type: string
                      required: true
                      description: The username of the user that did this action. Will be `moderation team`
                        unless the caller has the `admin` or `hosting advisor` permission
                    username:
                      type: string
                      required: true
                      description: The username of the user that was modified
                    at:
                      type: string
                      required: true
                      description: The time that the modification occurred
                    permission:
                      type: string
                      required: true
                      description: The name of the role that was added/removed
                    added:
                      type: boolean
                      required: true
                      description: Whether the role was added or removed
        '400':
          $ref: '#/components/responses/BadRequest'
  /permissions/{permission}:
    get:
      tags:
        - Permissions
      summary: List users with a permission
      description: Either shows a list of usernames with the given permission OR an object of `first letter of username` -> number of users
      parameters:
        - in: path
          name: permission
          schema:
            type: string
          description: The id of the permission to look up
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                description: a map of `first letter of username` to number of members
                additionalProperties:
                  type: number
                example:
                  a: 50
                  h: 11
                  hosting banned: 3
                  t: 8
                  u: 1
  /permissions/{permission}/{letter}:
    get:
      tags:
        - Permissions
      summary: Lists users with the permission that start with the letter
      description: Shows all members of the given permission that start with the given letter
      parameters:
        - in: path
          name: permission
          schema:
            type: string
          description: The id of the permission to lookup
        - in: path
          name: letter
          schema:
            type: string
          description: The first letter of the username to lookup
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: the username of the member
                example:
                  - aaa
                  - abb
                  - acc
                  - ADD
  /permissions/{permission}/{username}:
    post:
      tags:
        - Permissions
      summary: Adds a permission to a user
      description: Adds the given permission to the given username, requires `admin` permission
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: username
          schema:
            type: string
          required: true
          description: What user to give the role to
        - in: path
          name: permission
          schema:
            type: string
          description: The name of the role to grant
          required: true
      responses:
        '201':
          description: Role added
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    delete:
      tags:
        - Permissions
      summary: Removes a permission from a user
      description: Removes the given permission from the given username, requires admin role
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: username
          schema:
            type: string
          required: true
          description: What user to give the role to
        - in: path
          name: permission
          schema:
            type: string
          description: The name of the role to grant
          required: true
      responses:
        '204':
          description: Role removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /users/{username}/permissions:
    get:
      tags:
        - Permissions
      summary: List all permissions for a given user
      description: Shows all currently granted permissions for given username, will return empty array for unknown users the same as users without any permissions
      parameters:
        - in: path
          name: username
          schema:
            type: string
          required: true
          description: username to lookup
      responses:
        '200':
          description: 'Successful query'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                  - hosting advisor
                  - admin
  /modifiers:
    get:
      tags:
        - Modifiers
      summary: Lists all allowed modifiers for a match
      description: Lists all allowed modifiers for a match, modifiers do not conflict with other matches
      responses:
        '200':
          description: 'Successful query'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModifierResponse'
    post:
      tags:
        - Modifiers
      security:
        - SessionCookie: []
        - UserApiToken: []
      summary: Create a modifier
      description: Creates a new modifier, display name used must not already exist, requires `hosting advisor` permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              description: The display name to create, sent as a JSON string
            example: CutClean
      responses:
        '201':
          description: Modifier created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifierResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /modifiers/{id}:
    delete:
      tags:
        - Modifiers
      security:
        - SessionCookie: []
        - UserApiToken: []
      summary: Delete a modifier
      description: Deletes a modifier, requires `hosting advisor` permission
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: The ID to delete
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Could not find a modifier with the given ID
  /host-applications:
    get:
      tags:
        - Host Applications
      summary: List recent host applications
      description: Lists the 50 most recently created host applications, most recently created first. Public endpoint
      responses:
        '200':
          description: 'Successful query'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HostApplicationResponse'
    post:
      tags:
        - Host Applications
      summary: Submit a host application
      description: Submits a new host application answering every configured quiz question, multiple choice answers
        must exactly match the text of one of the choices, text answers must not be blank, validation errors are
        returned as a comma-separated list in the 400 body. Requires the user to not already be a `host`/`trial
        host`, to not have the `hosting banned` permission, and to not already have a pending application
      security:
        - SessionCookie: []
        - UserApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHostApplicationRequest'
      responses:
        '201':
          description: Created, returns the ID of the new application
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /host-applications/{id}:
    get:
      tags:
        - Host Applications
      summary: Get a specific host application
      description: Returns full details of an application including submitted answers. Public endpoint, however
        `choiceCorrect` on each answer is only defined (non-null) for `multiple choice` questions when authenticated
        as a user with the `hosting advisor` permission
      security:
        - SessionCookie: []
        - UserApiToken: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: The ID of the application
      responses:
        '200':
          description: 'Successful query'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostApplicationDetailsResponse'
        '404':
          description: Could not find an application with the given ID
  /host-applications/{id}/approve:
    post:
      tags:
        - Host Applications
      summary: Approve a host application
      description: Approves a pending application and grants the applicant the `trial host` permission, requires `hosting advisor` permission
      security:
        - SessionCookie: []
        - UserApiToken: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: The ID of the application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewHostApplicationRequest'
      responses:
        '200':
          description: Approved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Could not find an application with the given ID
  /host-applications/{id}/decline:
    post:
      tags:
        - Host Applications
      summary: Decline a host application
      description: Declines a pending application, requires `hosting advisor` permission. A non-blank `reason` must be supplied in the request body
      security:
        - SessionCookie: []
        - UserApiToken: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: The ID of the application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewHostApplicationRequest'
      responses:
        '200':
          description: Declined
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Could not find an application with the given ID
  /quiz:
    get:
      tags:
        - Host Applications
      summary: List quiz questions
      description: Lists all quiz questions that must be answered to submit a host application. Public endpoint,
        `choices` is empty for `text` questions, `correct` and `metadata` are only defined when authenticated as a
        user with the `hosting advisor` permission
      responses:
        '200':
          description: 'Successful query'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuizQuestionResponse'
    post:
      tags:
        - Host Applications
      summary: Create a quiz question
      description: Creates a new quiz question, requires `hosting advisor` permission. The prompt must be at least
        5 characters, `multiple choice` questions require at least 2 choices with exactly 1 correct, `text` questions
        must have an empty `choices` array
      security:
        - SessionCookie: []
        - UserApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizQuestionRequest'
      responses:
        '201':
          description: Created, returns the ID of the new question
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /quiz/{id}:
    delete:
      tags:
        - Host Applications
      summary: Delete a quiz question
      description: Deletes a quiz question and its choices, requires `hosting advisor` permission
      security:
        - SessionCookie: []
        - UserApiToken: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: The ID of the question to delete
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

tags:
  - name: Authentication
  - name: Time
  - name: Rules
  - name: Matches
  - name: Permissions
  - name: Modifiers
  - name: Host Applications

