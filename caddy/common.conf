# Shared handlers for the hosts frontend (built FE + API/auth proxy)
(common) {
  encode zstd gzip

  @backend path /api /api/* /authenticate /authenticate/*

  handle @backend {
    reverse_proxy app:10000
  }
}

(frontend_built) {
	handle {
		root * /srv/hosts

		templates {
			between "{{#" "#}}"
		}

		@hashed path /assets/*
		header @hashed {
			Cache-Control "public, max-age=31536000, immutable"
		}
		@html not path /assets/*
		header @html {
			Cache-Control "no-cache"
		}

		try_files {path} /index.html
		file_server
	}
}
