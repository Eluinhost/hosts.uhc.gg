# Shared handlers for the hosts frontend (built FE + API/auth proxy)
(common) {
	encode zstd gzip

	header {
		Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://*.google-analytics.com https://*.google.com https://raw.githubusercontent.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
	}

	@backend path /api /api/* /authenticate /authenticate/*

	handle @backend {
		reverse_proxy app:10000
	}
}

(frontend_built) {
	handle {
		root * /srv/hosts

		templates {
			between "{{#" "#}}"
		}

		@hashed path /assets/*
		header @hashed {
			Cache-Control "public, max-age=31536000, immutable"
		}
		@html not path /assets/*
		header @html {
			Cache-Control "no-cache"
		}

		try_files {path} /index.html
		file_server
	}
}
